name: Installer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  installer_release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Coverage gate (lines 80, branches 70 — branches temporary, see package.json _c8Notes)
        run: npm run test:coverage --if-present || npx c8 --check-coverage --lines 80 --branches 70 --functions 80 --reporter=text --reporter=lcov node --test "tests/**/*.test.js" || npm test

      - name: Bundlesize guard
        run: npx bundlesize --help > /dev/null 2>&1 && npx bundlesize || echo "bundlesize not installed — skipping (config in package.json bundlesize)"

      - name: Build installer + portable
        run: |
          npm run pack
          powershell -Command "Compress-Archive -Path dist\\win-unpacked\\* -DestinationPath dist\\RustyPlayer-Portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: iscc installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/RustyPlayer-Portable.zip
            dist/win-unpacked/RustyPlayer.exe
            dist/rustyplayer-setup-*.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v4
        with:
          files: |
            dist/RustyPlayer-Portable.zip
            dist/win-unpacked/RustyPlayer.exe
            dist/rustyplayer-setup-*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
