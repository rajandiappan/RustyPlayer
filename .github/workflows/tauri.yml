name: Tauri — Test and Build

# Primary release pipeline (post-cutover 2026-09-12). Electron workflows
# (build/portable/installer) were removed; Electron app is archived to
# legacy-electron/ + `legacy-electron` branch. Tauri sources live at root:
# src/, src-tauri/, tests/, index.html, package.json.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/tauri.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed for tauri-action updater JSON + GitHub releases on tags
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust (1.79+ for Tauri 2.x)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Rust unit tests (commands/config validation ports)
        working-directory: src-tauri
        run: cargo test --locked

      - name: Frontend adapter tests (tauriIpc parity)
        run: npm test --if-present

  build:
    needs: [test]
    # Run on push/main + tags; PRs run test only (no signing, no release).
    # `test` skipped on paths-filtered pushes still allows build — use always().
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Shared cache key prefix with `test` job speeds up build.

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app (nsis, updater JSON)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: present ONLY on tags (see docs/TAURI_SIGNING.md).
          # Empty on branch pushes/PRs → unsigned build, still verifies bundler.
          # NEVER log these values; tauri-action reads them directly.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Windows code signing (optional, mirrors Electron CSC_LINK pattern):
          # TAURI_SIGNING_* is updater signing; Authenticode still uses CSC_LINK if configured.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          # Static strings only (no inline conditionals): only consumed when
          # tagName is set (tag builds). Inline && / || with special chars
          # fails workflow evaluation (instant run failure, 2026-09-12).
          releaseName: 'RustyPlayer (Tauri)'
          releaseBody: 'Pick one asset below. RustyPlayer_X.Y.Z_x64-setup.exe = recommended installer. RustyPlayer_X.Y.Z_x64_en-US.msi = managed and Group-Policy installs. RustyPlayer-portable-win64.zip = no-install use, needs WebView2 preinstalled. Verify with SHA256SUMS.txt. SmartScreen warning is expected until Authenticode signing lands.'
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: false
          includeUpdaterJson: true
          # tauri-action builds `bundle.targets` from tauri.conf.json ("all" → nsis + msi on Windows).
          args: --target x86_64-pc-windows-msvc

      # Portable zip + checksums: Tauri has no portable bundle target, so ship
      # the raw exe zipped (needs WebView2 preinstalled — noted in README).
      # Attaches to the SAME draft release tauri-action created above.
      - name: Build portable zip + checksums (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $exe = "src-tauri/target/x86_64-pc-windows-msvc/release/rustyplayer.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe — bundle step failed?" }
          New-Item -ItemType Directory -Path "dist-portable" -Force | Out-Null
          Compress-Archive -Path $exe -DestinationPath "dist-portable/RustyPlayer-portable-win64.zip" -Force
          $files = @(
            "dist-portable/RustyPlayer-portable-win64.zip"
          ) + @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe") `
            + @(Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi")
          $files | ForEach-Object { Get-FileHash $_ -Algorithm SHA256 } |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content "dist-portable/SHA256SUMS.txt"
          Get-Content "dist-portable/SHA256SUMS.txt"

      - name: Attach portable + checksums to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist-portable/RustyPlayer-portable-win64.zip
            dist-portable/SHA256SUMS.txt

      - name: Bundlesize gate (<25MB no-ffmpeg / <90MB ffmpeg opt-in)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/release/bundle"
          echo "== bundle sizes =="
          find "$BUNDLE_DIR" -maxdepth 3 \( -name '*.exe' -o -name '*.msi' \) -exec du -h {} \; || echo "(no installers found — check tauri.conf.json bundle.targets)"
          # Fail if any portable/nsis exe exceeds hard cap (90MB allows ffmpeg opt-in; tighten to 25MB once canvas thumbs land).
          FAIL=0
          while IFS= read -r f; do
            BYTES=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            MAX=$((90*1024*1024))
            if [ "$BYTES" -gt "$MAX" ]; then echo "::error::oversize $f ($BYTES bytes > 90MB)"; FAIL=1; fi
          done < <(find "$BUNDLE_DIR" -maxdepth 3 -name '*.exe')
          exit $FAIL

      - name: Upload Tauri artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/latest.json
